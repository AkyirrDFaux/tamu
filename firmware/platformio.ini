; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Tamu_v2_0A

; Options shared by every environment (the base sections below are extended per family).
[env]
build_type = release
monitor_speed = 115200

; CH32V003 (DAS) environments share the platform, framework and upload tool.
[das]
; Pinned to a commit on purpose: a bare git URL resolves to the default-branch head at install
; time, so a fresh clone or a `pio pkg update` silently changes the DAS toolchain. Both DAS envs
; are tight (99 % RAM, 94 % flash), so move this only deliberately and rebuild afterwards.
platform = https://github.com/Community-PIO-CH32V/platform-ch32v#8cf3b51
framework = noneos-sdk
board = genericCH32V003F4P6
upload_protocol = minichlink
debug_tool = minichlink

; ESP32-C3 (core) environments share the platform, board and monitor setup.
[core]
; Pinned on purpose: 7.1.3 bundles framework-espidf 4.60100.0, where the IDF bootloader
; subproject fails to compile (esp_private/regi2c_ctrl.h includes hal/regi2c_impl.h, owned by
; the esp_hal_regi2c component, whose include dir is not passed to that target). Moving this
; pin is deliberate - rebuild one env at a time and delete .pio/build/<env> first.
platform = espressif32@7.0.1
framework = espidf
board = esp32-c3-devkitc-02
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

; CH32V203G8R6 (Valu v2.0) environments share the platform, board and USB toolchain.
[valu]
; Pinned to a commit on purpose (same pin as [das]): a bare git URL resolves to the
; default-branch head at install time, so a fresh clone silently changes the toolchain.
platform = https://github.com/Community-PIO-CH32V/platform-ch32v#8cf3b51
framework = noneos-sdk
board = genericCH32V203G8R6
; The main app is linked AND flashed at 0x3000, on top of the 12 KB bootloader. The
; platform derives the linker FLASH origin from this option, so the bootloader env below
; overrides it back to 0x0 (it runs first and owns the bottom of flash).
board_upload.offset_address = 0x3000
; The platform's own switch: puts -flto on BOTH the compile and the link command. It is
; load-bearing for the bootloader (the feasibility spike measured 8472 B -> 6784 B with it);
; build_flags do NOT reach LINKFLAGS, so it has to be this switch, not -flto in build_flags.
board_build.use_lto = true
; -Iinclude: TinyUSB translation units must find tusb_config.h (firmware/include/) while the
; TinyUSB library itself is compiled. PlatformIO scopes CPPPATH per library, so the project's
; include/ dir is NOT on the path for the library; this -I is the fix the spike established.
build_flags = 
	-Os
	-ffunction-sections
	-fdata-sections
	-fno-unwind-tables
	-fno-exceptions
	-Wno-unused-function
	-Wl,--gc-sections
	-Iinclude

[env:DAS_v0_1]
extends = das
# The DAS links no allocator (no USE_DYNAMIC_BLOCKS, no scripts, no stdio), so the linker's
# implicit heap - the gap between _end and the stack - is dead RAM. The stack is placed at
# RAM_TOP - stack_size, so 1000 (= the 2 KB RAM minus the 1048 B of statics) hands the whole gap
# to the stack and leaves no unreachable heap. The linker errors if statics ever grow into the
# stack, so this is self-guarding.
board_build.stack_size = 1000
; The bootloader owns 0x0-0x800, so the app is linked AND flashed at 0x800. The platform's
; linker template rounds maximum_size to whole KB: 0x3800 -> 14K, so the region is
; [0x800, 0x4000) and the .fixed_data reservation at 0x3E00 stays inside it. The storage is
; 512 B (8 x 64 B pages: pointer page + file table + 384 B data) so the full multi-file
; filesystem has ample room and the DAS keeps a comfortable app-code gap (`_etext` +376 B).
board_upload.offset_address = 0x800
board_upload.maximum_size = 14336
build_flags = 
	-Os
	-flto
	-ffunction-sections
	-fdata-sections
	-fno-unwind-tables
	-fno-exceptions
	-D BOARD_DAS_v0_1
	-D STORAGE_FLASH_SIZE=512
	-D STORAGE_BLOCK_SIZE=64
	-D MEMORY_BACKUP_CAP=128
	-D MAX_PROVIDER_SUBS=4
	-D NUMBER_ONLY_32BIT
	-D USE_REGISTER_SERVICE
	-D SCALAR_ONLY
	-D USE_SUB_PROVIDE
	-Wno-unused-function
	-Wl,--section-start=.fixed_data=0x3E00
	-Wl,--gc-sections
; Stamp the version on every changed build, then rewrite the upload offset for minichlink.
extra_scripts = 
	pre:scripts/auto_version.py
	post:scripts/das_app_upload.py
; The core (ESP-IDF) bootloader source is not part of the DAS app.
build_src_filter = +<*> -<Bootloader/>

; The DAS bootloader (Docs/Services/Bootloader.md): a standalone 2 KB image at 0x0 that
; launches the app at 0x800 unless the button is held at reset. Flash it with
;   pio run -e DAS_bootloader -t upload
; then the app with
;   pio run -e DAS_v0_1 -t upload
[env:DAS_bootloader]
extends = das
board_build.stack_size = 512
; The linker region is the 2 KB budget: a build that grows past it fails to link.
board_upload.maximum_size = 2048
; The bootloader needs neither the framework's printf/Delay debug code nor the C++ init/fini
; shims, so keep them out of the link.
board_build.use_builtin_debug_code = false
board_build.cpp_support = false
build_flags = 
	-Os
	-flto
	-ffunction-sections
	-fdata-sections
	-fno-unwind-tables
	-fno-exceptions
	-D BOARD_DAS_v0_1
	-D BOOTLOADER_BUILD
	-Wno-unused-function
	-Wl,--gc-sections
; Only the bootloader source (plus the framework startup/SPL); the app's Main.cpp defines its
; own main().
build_src_filter = +<Devices/DAS_v0.1/Bootloader.cpp>

[env:Tamu_v2_0A]
extends = core
; The main app lives in ota_0. app_partition_name selects it for the size check; the upload
; offset is repointed there by the post:scripts/core_app_offset.py hook (PlatformIO otherwise
; follows the boot-default `factory` partition), so `pio run -e Tamu_v2_0A -t upload` writes
; ota_0 and leaves the factory bootloader alone.
board_build.app_partition_name = ota_0
build_flags = 
	-D BOARD_Tamu_v2_0A
	-D TYPE_CORE
	-D USE_DYNAMIC_BLOCKS
	-D USE_SCRIPTS
	; Speed variants where a site has two shapes (Core/Functions/Crc8.h, TODO A9). The size
	; variant is the default so the DAS keeps it; this target has flash to spare and the CRC
	; runs over every packet.
	-D OPTIMIZE_SPEED
	-D USE_APP_INTERFACE
	-D USE_SUB_REQUEST
	-D USE_SUB_PROVIDE
	-D STORAGE_FLASH_SIZE=0xED000
	-D CONFIG_ESP_CONSOLE_UART_CUSTOM=y
	-Wno-error=old-style-declaration
	-Wno-error=c++-compat
	-Wno-error=missing-field-initializers
	; Release-speed build. The ESP32-C3 has ~2.5 MB of unused app flash, so this target trades
	; size for speed. The platform appends its debug-profile flags AFTER build_flags, so they
	; are removed with build_unflags (a later -Og would otherwise win); this env used to
	; compile with -Og plus -fno-jump-tables / -fno-tree-switch-conversion / -fno-shrink-wrap.
	;   -O2      the project's own code at -O2 (measured much faster than -Og); -O3 would be
	;            another ~25 % on the render math but grows the image ~54 % - see TODO A4
	;   -fwrapv  keeps two's-complement wrap-around defined for the fixed-point arithmetic
	;            (the code relies on it; -O2/-O3 would otherwise exploit signed-overflow UB)
	-O2
	-fwrapv
; Stamp the deterministic version before the build, and point the upload at ota_0.
extra_scripts = 
	pre:scripts/auto_version.py
	post:scripts/core_app_offset.py
; Remove the platform's debug-profile flags so the speed flags above are the effective ones.
build_unflags = 
	-Og
	-fno-shrink-wrap
	-fno-jump-tables
	-fno-tree-switch-conversion

; The core (ESP32-C3) factory bootloader (Docs/Services/Bootloader.md): a small app that runs
; first, reads the button (B1), and either serves raw bootloader frames over USB into ota_0 or
; boots the main app. Flash it with
;   pio run -e Tamu_bootloader -t upload
; then the main app with
;   pio run -e Tamu_v2_0A -t upload
[env:Tamu_bootloader]
extends = core
; src/CMakeLists.txt builds only src/Bootloader/ for this env. The IDF component manager is
; disabled inside the project's CMakeLists.txt, keyed on TAMU_BOOTLOADER (a per-env cmake arg),
; so it cannot leak into the main app's env in a multi-env build.
board_build.cmake_extra_args = -DTAMU_BOOTLOADER=ON
build_flags = 
	-D BOARD_Tamu_v2_0A
	-D CONFIG_ESP_CONSOLE_UART_CUSTOM=y
	-O2
	-fwrapv
	-Wno-error=old-style-declaration
	-Wno-error=c++-compat
	-Wno-error=missing-field-initializers
build_unflags = 
	-Og
	-fno-shrink-wrap
	-fno-jump-tables
	-fno-tree-switch-conversion

; The Valu v2.0 (CH32V203G8R6) bootloader (Docs/Services/Bootloader.md): a standalone 12 KB
; image at flash 0x0 that serves raw bootloader frames over a USB CDC-ACM port and launches
; the app at 0x3000 unless the LED-button (PA2) is held at reset. The env name is fixed:
; firmware/scripts/valu_upload.py and ./upload.sh reference `Valu_bootloader`. The first
; image has to go in over the WCH-Link probe (python3 firmware/scripts/valu_upload.py);
; build it with
;   pio run -e Valu_bootloader
[env:Valu_bootloader]
extends = valu
; Custom startup: a copy of the framework's startup_ch32v20x_D6.S whose non-RTOS `mstatus` value
; sets MPP = 11 (machine mode) instead of MPP = 00. The framework's bare-metal value makes the
; `mret` drop the CPU to User mode; the app is then entered by a JUMP from this post-mret context
; and inherits User mode, where its reset code's csrw instructions (0xbc0/0x804/mstatus/mtvec) are
; illegal - so the app trapped before main() when launched from the bootloader.
board_build.startup = src/Devices/Valu_v2.0/startup_ch32v20x_boot.S
; The bootloader is the thing that runs FIRST, so it links at flash 0x0 - not the 0x3000
; app base the [valu] base carries (which the platform turns into the linker FLASH origin).
board_upload.offset_address = 0x0
; The whole budget: the bootloader owns 0x0-0x3000. 12 KB rather than 8 KB because the
; FSDEV/USBD USB stack TinyUSB needs overflows an 8 KB region by ~2 KB. A build that grows
; past it fails to link.
board_upload.maximum_size = 12288
; The bootloader needs neither the framework's printf/Delay debug code nor the C++ init/fini
; shims, so keep them out of the link.
board_build.use_builtin_debug_code = false
board_build.cpp_support = false
build_flags = 
	${valu.build_flags}
	-D BOARD_Valu_v2_0
	-D BOOTLOADER_BUILD
lib_deps = 
	; TinyUSB 0.21.0 (newest release at the spike). It compiles every .c under src/, but with
	; CFG_TUSB_MCU=OPT_MCU_CH32V20X / CFG_TUD_ENABLED=1 / CFG_TUH_ENABLED=0 / CFG_TUD_CDC=1
	; the unrelated translation units go empty and -Wl,--gc-sections drops them.
	https://github.com/hathach/tinyusb#0.21.0
; Only the bootloader source (plus the framework startup/System/SPL); the app's Main.cpp
; defines its own main(). Same shape as [env:DAS_bootloader].
build_src_filter = +<Devices/Valu_v2.0/Bootloader.cpp>

; The Valu v2.0 (CH32V203G8R6) application (Docs/Devices.md "Valu v2.0"): the firmware that
; runs at 0x3000 after the bootloader. A standalone node whose only interface is the USB CDC
; App Interface; no RSBus (not among its services). Build with
;   pio run -e Valu_v2_0
[env:Valu_v2_0]
extends = valu
; Custom startup (a copy of the framework's startup_ch32v20x_D6.S with its `jal SystemInit` changed
; to `jal ValuClockInit`): the app runs after the bootloader, which has already brought the 144 MHz
; PLL up, and re-running the framework's SystemInit then hangs (sticky PLLRDY -> SWS never settles);
; ValuClockInit (Devices/Valu_v2.0/System.h) calls SystemInit only on a cold start.
board_build.startup = src/Devices/Valu_v2.0/startup_ch32v20x_D6.S
; The app links AND flashes at 0x3000, on top of the 12 KB bootloader. Already the [valu]
; base default; restated so the region is self-documenting here and a base change cannot
; silently move the app off the bootloader's launch address.
board_upload.offset_address = 0x3000
; The app window: [0x3000, 0xE000) = 45056 B = 44 KiB. The top 8 KiB (0xE000..0x10000) is
; the Valu's storage region (Docs/Devices.md "Storage: 8kB"), reserved by
; Devices/Valu_v2.0/Storage.h. The linker region is this window only, so a build that grows
; past 44 KiB (into the storage area) fails to link rather than corrupting storage at runtime.
board_upload.maximum_size = 45056
; The app needs a bigger stack than the 2 KB default: LoadAllBackups places a
; MEMORY_BACKUP_CAP-sized buffer on the stack and ProcessBus dispatches handlers recursively
; beneath it. RAM is 20 KB, so 6 KB of stack still leaves a comfortable heap for the
; Dynamic Memory service (malloc).
board_build.stack_size = 6144
build_flags = 
	${valu.build_flags}
	-D BOARD_Valu_v2_0
	; Services per Docs/Devices.md: Mandatory (System/Register + Log + Storage) is always
	; compiled; these are the optional/capability-gated ones this board declares.
	-D USE_DYNAMIC_BLOCKS
	-D USE_SCRIPTS
	-D USE_APP_INTERFACE
	; The App Interface core (Core/Functions/AppInterface.h) is written for FreeRTOS on the
	; ESP32 core; this target is noneos-sdk, so it compiles the no-op critical-section path.
	-D APP_INTERFACE_SINGLE_THREADED
	; Size flag the 44 KB window needs (same shape as the DAS env): 32-bit-only fixed point
	; arithmetic, so the 64-bit multiply/divide helpers are not pulled in. NOTE: SCALAR_ONLY
	; is deliberately NOT set - the Script service calls Number sqrt(), which Core/Types/
	; Number.h compiles out on SCALAR_ONLY targets, and this board does run scripts.
	-D NUMBER_ONLY_32BIT
	; Storage geometry (Docs/Devices.md): 8 kB region, 256-byte fast-erase page (CH32V20x
	; FLASH_ErasePage_Fast).
	-D STORAGE_FLASH_SIZE=8192
	-D STORAGE_BLOCK_SIZE=256
	-D MEMORY_BACKUP_CAP=512
	; Script registry size: 256 slots cost ~38 KB of RAM (Core/Services/ScriptDefs.h), which
	; does not fit the CH32V203's 20 KB. 16 loaded-script slots (~2.4 KB) instead; higher
	; Scripts-range indices simply report as unloaded. (MAX_SCRIPTS is a build knob, same idea
	; as MAX_PROVIDER_SUBS.)
	-D MAX_SCRIPTS=16
lib_deps = 
	; TinyUSB 0.21.0, the same pin as [env:Valu_bootloader]; the shared tusb_config.h
	; (firmware/include/) selects FSDEV/USBD on roothub port 0 and one CDC-ACM function.
	https://github.com/hathach/tinyusb#0.21.0
; The app is everything except the two bootloader sources: the ESP32 core bootloader
; (src/Bootloader/) and this board's raw USB bootloader (Devices/Valu_v2.0/Bootloader.cpp,
; guarded by BOOTLOADER_BUILD - and this env deliberately does NOT define it).
build_src_filter = +<*> -<Bootloader/> -<Devices/Valu_v2.0/Bootloader.cpp> -<Devices/Valu_v2.0/startup_ch32v20x_D6.S> -<Devices/Valu_v2.0/startup_ch32v20x_boot.S>
; Stamp the deterministic version (VERSION_* in RegisterRead.h) before the build, like the
; other versioned envs. No post-hook: this board's image goes in over the WCH-Link probe by
; hand (firmware/scripts/valu_upload.py), not PlatformIO's upload target.
extra_scripts = 
	pre:scripts/auto_version.py

