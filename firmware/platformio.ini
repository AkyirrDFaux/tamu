; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Tamu_v2_0A

; Options shared by every environment (the base sections below are extended per family).
[env]
build_type = release
monitor_speed = 115200

; CH32V003 (DAS) environments share the platform, framework and upload tool.
[das]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v
framework = noneos-sdk
board = genericCH32V003F4P6
upload_protocol = minichlink
debug_tool = minichlink

; ESP32-C3 (core) environments share the platform, board and monitor setup.
[core]
platform = espressif32
framework = espidf
board = esp32-c3-devkitc-02
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

[env:DAS_v0_1]
extends = das
# The DAS links no allocator (no USE_DYNAMIC_BLOCKS, no scripts, no stdio), so the linker's
# implicit heap - the gap between _end and the stack - is dead RAM. The stack is placed at
# RAM_TOP - stack_size, so 1000 (= the 2 KB RAM minus the 1048 B of statics) hands the whole gap
# to the stack and leaves no unreachable heap. The linker errors if statics ever grow into the
# stack, so this is self-guarding.
board_build.stack_size = 1000
; The bootloader owns 0x0-0x800, so the app is linked AND flashed at 0x800. The platform's
; linker template rounds maximum_size to whole KB: 0x3800 -> 14K, so the region is
; [0x800, 0x4000) and the .fixed_data reservation at 0x3E00 stays inside it. The storage is
; 512 B (8 x 64 B pages: pointer page + file table + 384 B data) so the full multi-file
; filesystem has ample room and the DAS keeps a comfortable app-code gap (`_etext` +376 B).
board_upload.offset_address = 0x800
board_upload.maximum_size = 14336
build_flags = 
	-Os
	-flto
	-ffunction-sections
	-fdata-sections
	-fno-unwind-tables
	-fno-exceptions
	-D BOARD_DAS_v0_1
	-D STORAGE_FLASH_SIZE=512
	-D STORAGE_BLOCK_SIZE=64
	-D MEMORY_BACKUP_CAP=128
	-D MAX_PROVIDER_SUBS=4
	-D NUMBER_ONLY_32BIT
	-D USE_REGISTER_SERVICE
	-D SCALAR_ONLY
	-D USE_SUB_PROVIDE
	-Wno-unused-function
	-Wl,--section-start=.fixed_data=0x3E00
	-Wl,--gc-sections
; Stamp the version on every changed build, then rewrite the upload offset for minichlink.
extra_scripts = 
	pre:scripts/auto_version.py
	post:scripts/das_app_upload.py
; The core (ESP-IDF) bootloader source is not part of the DAS app.
build_src_filter = +<*> -<Bootloader/>

; The DAS bootloader (Docs/Services/Bootloader.md): a standalone 2 KB image at 0x0 that
; launches the app at 0x800 unless the button is held at reset. Flash it with
;   pio run -e DAS_bootloader -t upload
; then the app with
;   pio run -e DAS_v0_1 -t upload
[env:DAS_bootloader]
extends = das
board_build.stack_size = 512
; The linker region is the 2 KB budget: a build that grows past it fails to link.
board_upload.maximum_size = 2048
; The bootloader needs neither the framework's printf/Delay debug code nor the C++ init/fini
; shims, so keep them out of the link.
board_build.use_builtin_debug_code = false
board_build.cpp_support = false
build_flags = 
	-Os
	-flto
	-ffunction-sections
	-fdata-sections
	-fno-unwind-tables
	-fno-exceptions
	-D BOARD_DAS_v0_1
	-D BOOTLOADER_BUILD
	-Wno-unused-function
	-Wl,--gc-sections
; Only the bootloader source (plus the framework startup/SPL); the app's Main.cpp defines its
; own main().
build_src_filter = +<Devices/DAS_v0.1/Bootloader.cpp>

[env:Tamu_v2_0A]
extends = core
; The main app lives in ota_0. app_partition_name selects it for the size check; the upload
; offset is repointed there by the post:scripts/core_app_offset.py hook (PlatformIO otherwise
; follows the boot-default `factory` partition), so `pio run -e Tamu_v2_0A -t upload` writes
; ota_0 and leaves the factory bootloader alone.
board_build.app_partition_name = ota_0
build_flags = 
	-D BOARD_Tamu_v2_0A
	-D TYPE_CORE
	-D USE_DYNAMIC_BLOCKS
	-D USE_SCRIPTS
	; Speed variants where a site has two shapes (Core/Functions/Crc8.h, TODO A9). The size
	; variant is the default so the DAS keeps it; this target has flash to spare and the CRC
	; runs over every packet.
	-D OPTIMIZE_SPEED
	-D USE_APP_INTERFACE
	-D USE_SUB_REQUEST
	-D USE_SUB_PROVIDE
	-D STORAGE_FLASH_SIZE=0xED000
	-D CONFIG_ESP_CONSOLE_UART_CUSTOM=y
	-Wno-error=old-style-declaration
	-Wno-error=c++-compat
	-Wno-error=missing-field-initializers
	; Release-speed build. The ESP32-C3 has ~2.5 MB of unused app flash, so this target trades
	; size for speed. The platform appends its debug-profile flags AFTER build_flags, so they
	; are removed with build_unflags (a later -Og would otherwise win); this env used to
	; compile with -Og plus -fno-jump-tables / -fno-tree-switch-conversion / -fno-shrink-wrap.
	;   -O2      the project's own code at -O2 (measured much faster than -Og); -O3 would be
	;            another ~25 % on the render math but grows the image ~54 % - see TODO A4
	;   -fwrapv  keeps two's-complement wrap-around defined for the fixed-point arithmetic
	;            (the code relies on it; -O2/-O3 would otherwise exploit signed-overflow UB)
	-O2
	-fwrapv
; Stamp the deterministic version before the build, and point the upload at ota_0.
extra_scripts = 
	pre:scripts/auto_version.py
	post:scripts/core_app_offset.py
; Remove the platform's debug-profile flags so the speed flags above are the effective ones.
build_unflags = 
	-Og
	-fno-shrink-wrap
	-fno-jump-tables
	-fno-tree-switch-conversion

; The core (ESP32-C3) factory bootloader (Docs/Services/Bootloader.md): a small app that runs
; first, reads the button (B1), and either serves raw bootloader frames over USB into ota_0 or
; boots the main app. Flash it with
;   pio run -e Tamu_bootloader -t upload
; then the main app with
;   pio run -e Tamu_v2_0A -t upload
[env:Tamu_bootloader]
extends = core
; src/CMakeLists.txt builds only src/Bootloader/ for this env. The IDF component manager is
; disabled inside the project's CMakeLists.txt, keyed on TAMU_BOOTLOADER (a per-env cmake arg),
; so it cannot leak into the main app's env in a multi-env build.
board_build.cmake_extra_args = -DTAMU_BOOTLOADER=ON
build_flags = 
	-D BOARD_Tamu_v2_0A
	-D CONFIG_ESP_CONSOLE_UART_CUSTOM=y
	-O2
	-fwrapv
	-Wno-error=old-style-declaration
	-Wno-error=c++-compat
	-Wno-error=missing-field-initializers
build_unflags = 
	-Og
	-fno-shrink-wrap
	-fno-jump-tables
	-fno-tree-switch-conversion

